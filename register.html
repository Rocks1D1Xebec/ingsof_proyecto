<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EduAsistente - Crea tu cuenta y comienza a estudiar con tu compañero de estudio en casa">
  <title>EduAsistente - Crear Cuenta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar__brand">
      <div class="navbar__logo" aria-label="Logo EduAsistente">📖</div>
      <div>
        <div class="navbar__title">EduAsistente</div>
        <div class="navbar__subtitle">Tu compañero de estudio en casa</div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero-section">
    <p class="hero__tag">Aprende a tu ritmo</p>
    <h1 class="hero__title">Todo lo que no entiendes, lo vemos juntos.</h1>
    <p class="hero__description">Explicaciones claras, paso a paso y sin miedo a equivocarte.</p>
  </section>

  <!-- Formulario de Registro -->
  <main class="auth-card" id="register-form">
    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <a href="login.html" class="auth-tab" role="tab" id="tab-login">Iniciar Sesión</a>
      <button class="auth-tab auth-tab--active" role="tab" id="tab-register" aria-selected="true">Crear Cuenta</button>
    </div>

    <form id="form-register" autocomplete="off">
      <!-- Nombre -->
      <div class="form-group">
        <label class="form-label" for="input-name">Tu nombre completo</label>
        <div class="form-input-wrapper">
          <input
            type="text"
            id="input-name"
            class="form-input"
            placeholder="Ej. Carlos"
            required
          >
        </div>
      </div>

      <!-- Correo electrónico -->
      <div class="form-group">
        <label class="form-label" for="input-email">Correo electrónico</label>
        <div class="form-input-wrapper">
          <input
            type="email"
            id="input-email"
            class="form-input"
            placeholder="Ej. carlos@correo.com"
            required
          >
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label class="form-label" for="input-password">Contraseña</label>
        <div class="form-input-wrapper">
          <input
            type="password"
            id="input-password"
            class="form-input"
            placeholder="Escribe tu contraseña"
          >
          <button type="button" class="form-toggle-password" id="btn-toggle-password" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>

      <!-- Botón submit -->
      <button type="submit" class="btn btn--primary" id="btn-register">
        Comenzar a Estudiar &nbsp;→
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="auth-footer" id="auth-footer">
    Tu espacio seguro para aprender en calma.
  </footer>

  <script>
    // Verificar si ya tiene sesión activa
    fetch('/api/sesion').then(r => r.json()).then(data => {
      if (data.autenticado) window.location.href = 'dashboard.html';
    }).catch(() => {});

    // Toggle password visibility
    const toggleBtn = document.getElementById('btn-toggle-password');
    const passwordInput = document.getElementById('input-password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.textContent = isPassword ? '🙈' : '👁';
    });

    // Form submit — conecta con /api/register
    const formRegister = document.getElementById('form-register');
    const btnRegister = document.getElementById('btn-register');

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();

      const prevError = formRegister.querySelector('.form-error');
      if (prevError) prevError.remove();

      const nombre = document.getElementById('input-name').value.trim();
      const email = document.getElementById('input-email').value.trim();
      const contrasena = passwordInput.value.trim();

      if (!nombre || !email || !contrasena) {
        mostrarError('Por favor, completa todos los campos');
        return;
      }

      if (contrasena.length < 4) {
        mostrarError('La contraseña debe tener al menos 4 caracteres');
        return;
      }

      btnRegister.disabled = true;
      btnRegister.textContent = 'Creando cuenta...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, contrasena }),
        });

        const data = await res.json();

        if (data.ok) {
          localStorage.setItem('usuario_nombre', data.usuario.nombre);
          localStorage.setItem('usuario_id', data.usuario.id);
          window.location.href = 'dashboard.html';
        } else {
          mostrarError(data.error || 'Error al crear la cuenta');
        }
      } catch (err) {
        mostrarError('No se pudo conectar con el servidor. Intenta de nuevo.');
      } finally {
        btnRegister.disabled = false;
        btnRegister.innerHTML = 'Comenzar a Estudiar &nbsp;→';
      }
    });

    function mostrarError(msg) {
      const prevError = formRegister.querySelector('.form-error');
      if (prevError) prevError.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'form-error';
      errorDiv.textContent = msg;
      errorDiv.style.cssText = 'color:#ef4444;font-size:0.82rem;text-align:center;margin-top:12px;padding:10px;background:rgba(239,68,68,0.1);border-radius:8px;';
      formRegister.appendChild(errorDiv);
    }
  </script>

</body>
</html>
